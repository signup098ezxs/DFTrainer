# Test builds on any branch but main (main builds both inside the release workflow): the native tracker DLL (kept as
# a workflow artifact) and a Windows compile check of the launcher. Nothing is released.
name: Native tracker

on:
  push:
    branches-ignore: [main]
    paths: ["native/**", "launcher/**", "tools/build-native.sh", ".github/workflows/native.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build
        timeout-minutes: 10
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo -E apt-get update -qq
          sudo -E apt-get install -y -qq --no-install-recommends g++-mingw-w64-x86-64 >/dev/null
          bash tools/build-native.sh
          x86_64-w64-mingw32-objdump -p app/mod/DFTrainer/native/lantern_native.dll | grep -E "DLL Name|^\s+[0-9a-f]+\s+[0-9]+\s+\w" | head -80
      - uses: actions/upload-artifact@v4
        with:
          name: lantern_native
          path: app/mod/DFTrainer/native/lantern_native.dll
      - uses: actions/setup-go@v5
        with:
          go-version-file: launcher/go.mod
      - name: Launcher compiles for Windows
        working-directory: launcher
        env:
          GOOS: windows
          GOARCH: amd64
        # placeholders for what tools/build.mjs puts in embedded/ before a real build
        run: |
          mkdir -p embedded
          [ -f embedded/app.zip ] || : > embedded/app.zip
          [ -f embedded/app-version.txt ] || echo 0.0.0 > embedded/app-version.txt
          # -unsafeptr=false: the Win32 calls pass uintptrs on purpose (sys_windows.go, window_windows.go)
          go vet -unsafeptr=false ./... && go build -o /dev/null .

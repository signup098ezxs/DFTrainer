# Publishes a Lantern Client release whenever app/release.json gets a new version on main.
# Installed launchers find it on GitHub Releases, check its signature and update themselves.
#
# One-time set-up: Settings > Secrets and variables > Actions > New repository secret
#   DFT_RELEASE_KEY = the whole content of release-key.pem (made by tools/keygen.mjs; never commit it)
name: Release

on:
  push:
    branches: [main]
    paths: ["app/**", "launcher/**", "tools/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: v
        run: |
          v=$(node -p "require('./app/release.json').version")
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if gh release view "v$v" >/dev/null 2>&1; then
            echo "v$v is already released: nothing to do (bump app/release.json to release)."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: actions/setup-go@v5
        if: steps.v.outputs.skip != 'true'
        with:
          go-version-file: launcher/go.mod

      - uses: actions/setup-node@v4
        if: steps.v.outputs.skip != 'true'
        with:
          node-version: 22

      # Optional Authenticode signing: add the secrets SIGN_PFX_BASE64 (the .pfx, base64) and SIGN_PASS to turn it on
      - name: Code-signing certificate
        id: cert
        if: steps.v.outputs.skip != 'true'
        run: |
          if [ -n "$SIGN_PFX_BASE64" ]; then
            sudo apt-get install -y -qq osslsigncode >/dev/null
            echo "$SIGN_PFX_BASE64" | base64 -d > "$RUNNER_TEMP/sign.pfx"
            echo "pfx=$RUNNER_TEMP/sign.pfx" >> "$GITHUB_OUTPUT"
          fi
        env:
          SIGN_PFX_BASE64: ${{ secrets.SIGN_PFX_BASE64 }}

      - name: Build and sign
        if: steps.v.outputs.skip != 'true'
        run: node tools/build.mjs --out dist
        env:
          DFT_RELEASE_KEY: ${{ secrets.DFT_RELEASE_KEY }}
          SIGN_PFX: ${{ steps.cert.outputs.pfx }}
          SIGN_PASS: ${{ secrets.SIGN_PASS }}

      - name: Publish
        if: steps.v.outputs.skip != 'true'
        run: |
          gh release create "v${{ steps.v.outputs.version }}" \
            dist/Lantern-Client-Setup.exe dist/LanternClient-app-*.zip dist/dftrainer-manifest.json \
            --title "Lantern Client ${{ steps.v.outputs.version }}" --notes-file dist/notes.md --latest
        env:
          GH_TOKEN: ${{ github.token }}
